<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <!-- Nền bóng đổ -->
  <rect x="5" y="72" width="90" height="8" rx="4" fill="#1e293b" opacity="0.3" />

  <!-- Thân tòa nhà trụ sở -->
  <rect x="10" y="25" width="80" height="50" fill="#f4d06f" stroke="#b08968" stroke-width="2" rx="2" />
  
  <!-- Hàng cột trụ mặt tiền -->
  <rect x="18" y="32" width="6" height="43" fill="#fff3b0" stroke="#b08968" stroke-width="1" />
  <rect x="36" y="32" width="6" height="43" fill="#fff3b0" stroke="#b08968" stroke-width="1" />
  <rect x="58" y="32" width="6" height="43" fill="#fff3b0" stroke="#b08968" stroke-width="1" />
  <rect x="76" y="32" width="6" height="43" fill="#fff3b0" stroke="#b08968" stroke-width="1" />

  <!-- Cửa chính vòm lớn -->
  <path d="M 44 75 L 44 48 Q 50 42 56 48 L 56 75 Z" fill="#7f4f24" stroke="#4a2810" stroke-width="1.5" />
  <circle cx="53" cy="62" r="1.5" fill="#f4d06f" />

  <!-- Cửa sổ các tầng -->
  <rect x="26" y="36" width="8" height="12" fill="#3a86ff" rx="1" />
  <rect x="66" y="36" width="8" height="12" fill="#3a86ff" rx="1" />
  <rect x="26" y="55" width="8" height="14" fill="#3a86ff" rx="1" />
  <rect x="66" y="55" width="8" height="14" fill="#3a86ff" rx="1" />

  <!-- Mái ngói đỏ tam giác -->
  <polygon points="5,25 95,25 50,5" fill="#c1121f" stroke="#780000" stroke-width="2" />
  <polygon points="12,24 88,24 50,8" fill="#d90429" />

  <!-- Quốc kỳ cờ đỏ sao vàng trên đỉnh -->
  <line x1="50" y1="5" x2="50" y2="-12" stroke="#6c757d" stroke-width="2" />
  <rect x="50" y="-12" width="16" height="10" fill="#da251d" />
  <!-- Ngôi sao vàng -->
  <polygon points="58,-10 59.5,-6 63.5,-6 60.5,-4 61.5,0 58,-2.5 54.5,0 55.5,-4 52.5,-6 56.5,-6" fill="#ffff00" transform="scale(0.8) translate(14, -2)" />

  <!-- Biển hiệu TRỤ SỞ -->
  <rect x="38" y="27" width="24" height="6" fill="#9d0208" rx="1" />
  <text x="50" y="31.5" font-family="Arial, sans-serif" font-size="4" font-weight="bold" fill="#ffb703" text-anchor="middle">TRỤ SỞ</text>
</svg>
