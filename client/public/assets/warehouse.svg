<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <rect x="5" y="70" width="90" height="8" rx="4" fill="#1e293b" opacity="0.3" />
  <!-- Thân kho gạch xám kiên cố -->
  <rect x="10" y="25" width="80" height="48" fill="#64748b" stroke="#334155" stroke-width="2" rx="2" />

  <!-- Cửa cuốn công nghiệp chính giữa -->
  <rect x="35" y="40" width="30" height="33" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />
  <line x1="35" y1="46" x2="65" y2="46" stroke="#94a3b8" stroke-width="1" />
  <line x1="35" y1="52" x2="65" y2="52" stroke="#94a3b8" stroke-width="1" />
  <line x1="35" y1="58" x2="65" y2="58" stroke="#94a3b8" stroke-width="1" />
  <line x1="35" y1="64" x2="65" y2="64" stroke="#94a3b8" stroke-width="1" />
  <rect x="47" y="68" width="6" height="3" fill="#334155" rx="1" />

  <!-- Ô thông gió / cửa sổ phụ -->
  <rect x="18" y="38" width="10" height="12" fill="#334155" rx="1" />
  <line x1="18" y1="44" x2="28" y2="44" stroke="#94a3b8" stroke-width="1" />
  <rect x="72" y="38" width="10" height="12" fill="#334155" rx="1" />
  <line x1="72" y1="44" x2="82" y2="44" stroke="#94a3b8" stroke-width="1" />

  <!-- Mái vòm tôn công nghiệp -->
  <path d="M 8 25 Q 50 10 92 25 Z" fill="#0284c7" stroke="#0369a1" stroke-width="2" />

  <!-- Biển hiệu KHO VẬT TƯ -->
  <rect x="32" y="27" width="36" height="8" fill="#0f172a" rx="2" />
  <text x="50" y="33" font-family="Arial, sans-serif" font-size="4.5" font-weight="bold" fill="#38bdf8" text-anchor="middle">KHO VẬT TƯ</text>

  <!-- Biểu tượng kiện hàng cạnh kho -->
  <rect x="74" y="62" width="10" height="10" fill="#d97706" stroke="#92400e" stroke-width="1" />
  <line x1="74" y1="67" x2="84" y2="67" stroke="#92400e" stroke-width="1" />
  <line x1="79" y1="62" x2="79" y2="72" stroke="#92400e" stroke-width="1" />
</svg>
