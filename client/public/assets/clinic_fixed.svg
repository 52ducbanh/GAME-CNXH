<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 70" width="90" height="70">
  <rect x="5" y="62" width="80" height="8" rx="4" fill="#1e293b" opacity="0.25" />
  <!-- Thân trạm y tế trắng tinh sạch sẽ -->
  <rect x="10" y="20" width="70" height="45" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" rx="3" />

  <!-- Mái ngói xanh dương y tế -->
  <polygon points="5,20 85,20 75,8 15,8" fill="#0284c7" stroke="#0369a1" stroke-width="1.5" />

  <!-- Cửa chính kính hai cánh -->
  <rect x="36" y="38" width="18" height="27" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
  <line x1="45" y1="38" x2="45" y2="65" stroke="#0284c7" stroke-width="1" />
  <!-- Tay nắm cửa -->
  <circle cx="43" cy="52" r="1" fill="#0284c7" />
  <circle cx="47" cy="52" r="1" fill="#0284c7" />

  <!-- Cửa sổ hai bên -->
  <rect x="18" y="35" width="12" height="15" fill="#bae6fd" stroke="#0284c7" stroke-width="1" rx="1" />
  <rect x="60" y="35" width="12" height="15" fill="#bae6fd" stroke="#0284c7" stroke-width="1" rx="1" />

  <!-- Dấu thập đỏ biểu tượng y tế trên mái -->
  <circle cx="45" cy="14" r="8" fill="#ffffff" stroke="#e11d48" stroke-width="1.5" />
  <rect x="43" y="9" width="4" height="10" fill="#e11d48" />
  <rect x="40" y="12" width="10" height="4" fill="#e11d48" />

  <!-- Bảng tên TRẠM Y TẾ CỐ ĐỊNH -->
  <rect x="25" y="24" width="40" height="7" fill="#0284c7" rx="1.5" />
  <text x="45" y="29" font-family="Arial, sans-serif" font-size="4" font-weight="bold" fill="#ffffff" text-anchor="middle">TRẠM Y TẾ</text>
</svg>
