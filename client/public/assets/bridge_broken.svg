<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 80" width="50" height="80">
  <!-- Mặt nước kênh bên dưới lộ rõ ở đoạn nứt -->
  <rect x="0" y="0" width="50" height="80" fill="#0369a1" />

  <!-- Mố cầu Tây còn lại -->
  <polygon points="2,5 18,5 14,75 2,75" fill="#64748b" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Mố cầu Đông còn lại -->
  <polygon points="32,5 48,5 48,75 36,75" fill="#64748b" stroke="#1e293b" stroke-width="1.5" />

  <!-- Đoạn giữa bị sụt gãy nứt vỡ xuống kênh nước -->
  <polygon points="18,30 25,48 14,52" fill="#475569" stroke="#0f172a" stroke-width="1.5" />
  <polygon points="32,25 36,45 28,40" fill="#475569" stroke="#0f172a" stroke-width="1.5" />

  <!-- Rào chắn cảnh báo nguy hiểm màu sọc vàng đen -->
  <!-- Rào phía Tây -->
  <rect x="10" y="20" width="6" height="40" fill="#facc15" stroke="#000000" stroke-width="1" />
  <line x1="10" y1="26" x2="16" y2="30" stroke="#000000" stroke-width="2" />
  <line x1="10" y1="36" x2="16" y2="40" stroke="#000000" stroke-width="2" />
  <line x1="10" y1="46" x2="16" y2="50" stroke="#000000" stroke-width="2" />

  <!-- Rào phía Đông -->
  <rect x="34" y="20" width="6" height="40" fill="#facc15" stroke="#000000" stroke-width="1" />
  <line x1="34" y1="26" x2="40" y2="30" stroke="#000000" stroke-width="2" />
  <line x1="34" y1="36" x2="40" y2="40" stroke="#000000" stroke-width="2" />
  <line x1="34" y1="46" x2="40" y2="50" stroke="#000000" stroke-width="2" />

  <!-- Biển báo CẤM QUA / SỰ CỐ CẦU HỎNG -->
  <circle cx="25" cy="40" r="10" fill="#dc2626" stroke="#ffffff" stroke-width="1.5" />
  <line x1="18" y1="33" x2="32" y2="47" stroke="#ffffff" stroke-width="3" />
</svg>
