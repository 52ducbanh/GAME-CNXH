<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 80" width="50" height="80">
  <!-- Mặt nước kênh bên dưới -->
  <rect x="0" y="0" width="50" height="80" fill="#0284c7" opacity="0.4" />
  
  <!-- Mố cầu phía Tây -->
  <rect x="2" y="5" width="10" height="70" fill="#64748b" stroke="#334155" stroke-width="1.5" />
  <!-- Mố cầu phía Đông -->
  <rect x="38" y="5" width="10" height="70" fill="#64748b" stroke="#334155" stroke-width="1.5" />

  <!-- Mặt cầu bê tông đá kiên cố -->
  <rect x="8" y="10" width="34" height="60" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
  
  <!-- Vạch kẻ đường bộ trên cầu -->
  <line x1="25" y1="14" x2="25" y2="24" stroke="#ffffff" stroke-width="2" />
  <line x1="25" y1="35" x2="25" y2="45" stroke="#ffffff" stroke-width="2" />
  <line x1="25" y1="56" x2="25" y2="66" stroke="#ffffff" stroke-width="2" />

  <!-- Lan can cầu phía Bắc và Nam -->
  <rect x="5" y="8" width="40" height="4" fill="#cbd5e1" stroke="#334155" stroke-width="1" />
  <rect x="5" y="68" width="40" height="4" fill="#cbd5e1" stroke="#334155" stroke-width="1" />
  
  <!-- Trụ đèn cầu -->
  <circle cx="8" cy="10" r="2.5" fill="#facc15" stroke="#334155" stroke-width="1" />
  <circle cx="42" cy="10" r="2.5" fill="#facc15" stroke="#334155" stroke-width="1" />
  <circle cx="8" cy="70" r="2.5" fill="#facc15" stroke="#334155" stroke-width="1" />
  <circle cx="42" cy="70" r="2.5" fill="#facc15" stroke="#334155" stroke-width="1" />
</svg>
